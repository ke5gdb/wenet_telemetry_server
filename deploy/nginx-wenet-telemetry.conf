# /etc/nginx/sites-available/wenet-telemetry
#
# Run `certbot --nginx -d telemetry.example.com` after installing this with the
# plain :80 server block; certbot rewrites it for TLS and adds the redirect.

upstream wenet_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Ingest is unauthenticated by default, so put a ceiling on it at the edge as
# well as in the app. Sized for a forwarder draining a disk spool after an
# outage, which arrives as a burst of hundreds of batches -- a limit tuned for
# steady state would turn a recovered outage back into lost telemetry.
limit_req_zone $binary_remote_addr zone=wenet_ingest:10m rate=60r/s;

server {
    listen 80;
    listen [::]:80;
    server_name telemetry.example.com;

    root /opt/wenet-telemetry/static;
    index index.html;

    # A batch of 2000 packets with raw hex is a few MB.
    client_max_body_size 8m;

    access_log /var/log/nginx/wenet-telemetry.access.log;
    error_log  /var/log/nginx/wenet-telemetry.error.log;

    gzip on;
    gzip_types application/json application/x-ndjson text/csv text/css
               application/javascript text/plain;
    gzip_min_length 1024;
    # `any` because the exports worth compressing are proxied responses; the
    # default (off) would skip every one of them. The event stream opts out
    # explicitly in its own location below.
    gzip_proxied any;

    # ---- the display: nginx serves it directly, uvicorn never sees it -------

    location = / {
        try_files /index.html =404;
    }

    # Allow /{callsign}
    location ~ ^/[A-Za-z0-9][A-Za-z0-9-]{2,15}$ {
        try_files /index.html =404;
    }

    location /static/ {
        alias /opt/wenet-telemetry/static/;
        access_log off;

        # Revalidate every load. There is no build step here, so filenames never
        # change when the code does -- with a max-age the browser does not even
        # ask, and a deploy silently leaves clients running the old JavaScript
        # until it expires. That is exactly how a fix can look like it did not
        # deploy: the server is new, the page is not.
        #
        # The cost is one conditional request per asset; nginx answers with a
        # 304 and no body, and there are four small files. Correctness after a
        # deploy is worth far more here than a few saved kilobytes.
        expires -1;
        etag on;
    }

    # ---- live telemetry stream ---------------------------------------------

    location = /events {
        proxy_pass http://wenet_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # The lines that make SSE actually stream. Without buffering off, nginx
        # holds messages until its buffer fills, and the display appears frozen
        # and then jumps. gzip buffers for the same reason, so it is off here
        # regardless of the server-level setting.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;

        # The app sends a comment frame every 15s; this only has to outlast that.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- ingest -------------------------------------------------------------

    location = /api/v1/ingest {
        limit_req zone=wenet_ingest burst=600 nodelay;
        limit_req_status 429;

        proxy_pass http://wenet_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # ---- everything else on the API, including exports ----------------------

    location /api/ {
        proxy_pass http://wenet_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # A whole-flight export streams for a while and can be large; do not
        # buffer it to disk and do not time it out mid-download.
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
